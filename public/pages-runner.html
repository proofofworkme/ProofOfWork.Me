<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProofOfWork Pages app preview</title>
  </head>
  <body>
    <p>Preparing app preview…</p>
    <script>
      (() => {
        "use strict";

        const MAX_FRAGMENT_CHARACTERS = 1_000_000;
        const MAX_DOCUMENT_BYTES = 120_000;

        function showError(message) {
          const paragraph = document.createElement("p");
          paragraph.textContent = message;
          document.body.replaceChildren(paragraph);
        }

        function runPreview() {
          if (document.readyState === "loading") {
            window.setTimeout(runPreview, 0);
            return;
          }

          const fragment = window.location.hash.slice(1);
          try {
            // The HTTP CSP makes this document opaque even when opened directly.
            // History updates can be denied in an opaque document; no bridge is needed.
            window.history.replaceState(null, "", window.location.pathname + window.location.search);
          } catch {
            // The fragment never enters a server request or referrer.
          }

          if (!fragment || fragment.length > MAX_FRAGMENT_CHARACTERS) {
            showError("The app preview source is missing or exceeds the preview limit.");
            return;
          }

          let html;
          try {
            html = decodeURIComponent(fragment);
          } catch {
            showError("The app preview source could not be decoded.");
            return;
          }

          if (!html.trim() || new TextEncoder().encode(html).byteLength > MAX_DOCUMENT_BYTES) {
            showError("The app preview source is empty or exceeds the preview limit.");
            return;
          }

          // The parent supplies a sanitized document. Its meta CSP adds restrictions to
          // this runner's response CSP; document.write cannot remove HTTP restrictions.
          // There is no message listener, signing provider, or parent API in this runner.
          document.open();
          document.write(html);
          document.close();
        }

        window.setTimeout(runPreview, 0);
      })();
    </script>
  </body>
</html>

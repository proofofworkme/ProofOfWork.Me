services:
  db:
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"
  api:
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"
  web:
    volumes:
      - /data/mempool/nginx-logs:/var/log/nginx
    logging:
      driver: json-file
      options:
        max-size: "25m"
        max-file: "4"

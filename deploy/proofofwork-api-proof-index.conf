[Unit]
RequiresMountsFor=/data/proofofwork-api-cache

[Service]
EnvironmentFile=/etc/proofofwork-api/proof-indexer-db.env
EnvironmentFile=/etc/proofofwork-api/internal-verifier.env
Environment=POW_API_CACHE_DIR=/data/proofofwork-api-cache
Environment=POW_API_DISK_MIN_FREE_BYTES=5368709120
Environment=POW_API_DISK_MAX_USED_PERCENT=90
Environment=POW_INDEX_DB_POOL_MAX=12
Environment=POW_INDEX_DB_CONNECT_TIMEOUT_MS=30000
Environment=POW_INDEX_READS=tx-status,log-history,token-history,token-state,registry-history,work-floor,work-summary,marketplace-summary,growth-summary,infinity-summary,inception-summary,event-history,address-mail
Environment=POW_INDEX_SHADOW_READS=log-history,token-history
Environment=POW_INDEX_READ_UNCONFIRMED_TX_STATUS=0
Environment=POW_INDEX_TOKEN_HISTORY_MAX_AGE_MS=86400000
Environment=POW_INDEX_CONFIRMED_READ_MAX_LAG_BLOCKS=6
Environment=POW_INDEX_HEALTH_MAX_AGE_MS=120000
Environment=POW_INTERNAL_VERIFIER_STATE_TTL_MS=120000
Environment=POW_INDEX_SNAPSHOT_READ_MAX_AGE_MS=600000
Environment=ENABLE_GLOBAL_ACTIVITY_CRAWL=0
Environment=ENABLE_SUMMARY_TOKEN_REFRESH=0
Environment=ENABLE_API_LEDGER_BACKGROUND_REFRESH=0
Environment=WORK_TOKEN_LIVE_NON_MINT_MAX_TXS=1000
Environment=WORK_TOKEN_LIVE_NON_MINT_SCAN_MAX_TXS=20000
Environment=WORK_FLOOR_FRESH_WAIT_MS=8000
Environment=WORK_TOKEN_CANONICAL_FRESH_WAIT_MS=30000
Environment=LEDGER_SUMMARY_FRESH_WAIT_MS=12000
Environment=LEDGER_SUMMARY_CURRENT_FALLBACK_WAIT_MS=45000
Environment=MARKETPLACE_SUMMARY_FRESH_WAIT_MS=12000
Environment=MARKETPLACE_SUMMARY_FRESH_HARD_CAP_MS=12000
Environment=MARKETPLACE_SUMMARY_CURRENT_FALLBACK_WAIT_MS=45000
Environment=SUMMARY_PROOF_INDEX_READ_WAIT_MS=45000
Environment=SUMMARY_TOKEN_CURRENT_FALLBACK_WAIT_MS=8000
Environment=MAIL_INDEXED_LOOKUP_WAIT_MS=10000
Environment=MAIL_INDEXED_ENRICH_WAIT_MS=10000
Environment=WALLET_SCOPED_INDEX_WAIT_MS=10000
Environment=ELECTRUM_HOST=172.27.0.1
Environment=ELECTRUM_PORT=50001
Environment=ELECTRUM_MAX_IN_FLIGHT=8
Environment=ELECTRUM_MAX_QUEUE=256
Environment=ELECTRUM_MAX_RESPONSE_BYTES=16777216
Environment=POW_API_BROADCAST_RATE_WINDOW_MS=60000
Environment=POW_API_BROADCAST_RATE_PER_CLIENT=12
Environment=POW_API_BROADCAST_RATE_GLOBAL=120
Environment=POW_API_BROADCAST_CONCURRENCY_MAX=4
Environment=POW_API_BROADCAST_ALLOW_MISSING_ORIGIN=0
Environment=POW_API_BROADCAST_BODY_TIMEOUT_MS=10000
# Historical Marketplace V4 remains disabled. AMO V5 has its own declaration
# pins and write gate so an old switch can never authorize the new protocol.
Environment=WORK_MARKETPLACE_WRITES_ENABLED=0
Environment=WORK_AMO_V5_DECLARATION_TXID=54d7a367a3998ce1327ee89d983a25c80ce34b96d9811807df215a8694aead36
Environment=WORK_AMO_V5_DECLARATION_HEIGHT=959620
Environment=WORK_AMO_V5_DECLARATION_BLOCK_HASH=0000000000000000000094195957f498f894c92f5d5f75ff5b9c9afc749a6811
Environment=WORK_AMO_V5_DECLARATION_BLOCK_INDEX=141
Environment=WORK_AMO_V5_DECLARATION_MEMO_SHA256=d947a9adaa9d84d05571d2addd210cc4aa194eac94562411397553ef8135f95f
Environment=WORK_AMO_V5_WRITES_ENABLED=0
# AMO V6 is staged fail-closed. Fill every declaration pin only after the
# exact proof-native declaration confirms, then enable writes as a separate
# supervised step after replay parity is proven.
Environment=WORK_AMO_V6_DECLARATION_TXID=
Environment=WORK_AMO_V6_DECLARATION_HEIGHT=
Environment=WORK_AMO_V6_DECLARATION_BLOCK_HASH=
Environment=WORK_AMO_V6_DECLARATION_BLOCK_INDEX=
Environment=WORK_AMO_V6_DECLARATION_MEMO_SHA256=
Environment=WORK_AMO_V6_DECLARATION_MEMO_BYTES=
Environment=WORK_AMO_V6_DECLARATION_PROTOCOL_VOUT=
Environment=WORK_AMO_V6_DECLARATION_RECORD_ORDINAL=
Environment=WORK_AMO_V6_DECLARATION_REGISTRY_PAYMENT_VOUT=
Environment=WORK_AMO_V6_WRITES_ENABLED=0
Environment=POW_API_HEADERS_TIMEOUT_MS=10000
Environment=POW_API_REQUEST_TIMEOUT_MS=30000
ExecStartPre=+/usr/bin/install -d -o powadmin -g powadmin -m 0750 /data/proofofwork-api-cache
ReadWritePaths=-/data/proofofwork-api-cache
LimitCORE=0
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
UMask=0027
CapabilityBoundingSet=
AmbientCapabilities=
PrivateDevices=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictRealtime=true
SystemCallArchitectures=native

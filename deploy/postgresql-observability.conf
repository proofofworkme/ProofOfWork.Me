# Query observability for the proof-index read model. Before installing this
# fragment, merge pg_stat_statements into the server's effective
# shared_preload_libraries list; never replace an existing library list. A
# PostgreSQL restart is required before applying the matching SQL migration.
compute_query_id = on
pg_stat_statements.max = 5000
pg_stat_statements.track = 'top'
pg_stat_statements.save = on

# Preserve enough timing evidence to distinguish CPU, storage and WAL stalls.
track_io_timing = on
track_wal_io_timing = on

# Record queries that exceed the public read budget without logging bind values.
log_min_duration_statement = '5s'
log_parameter_max_length = 0
log_lock_waits = on
deadlock_timeout = '1s'
log_autovacuum_min_duration = '5s'

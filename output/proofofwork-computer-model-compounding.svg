<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
<title id="title">One Computer. Explicit product ownership.</title><desc id="description">A scenario map of activity, capacity, and derived diagnostics Model breadth is not protocol activation. Current economic truth remains the shared confirmed-chain ledger.</desc>
<style>text { font-family: Arial, Helvetica, sans-serif; } .mono { font-variant-numeric: tabular-nums; }</style>
<rect width="1600" height="1000" fill="#f7f5ef"/>
<text x="70" y="74" font-size="42" fill="#242820" font-weight="700" text-anchor="start">One Computer. Explicit product ownership.</text>
<text x="70" y="112" font-size="21" fill="#666b61" font-weight="400" text-anchor="start">A scenario map of activity, capacity, and derived diagnostics</text>
<rect x="70" y="208" width="335" height="335" rx="14" fill="#ffffff" stroke="#d9dccf"/>
<rect x="70" y="208" width="335" height="8" rx="4" fill="#a4772d"/>
<text x="92" y="267" font-size="23" fill="#242820" font-weight="700" text-anchor="start">01  Identity</text>
<text x="92" y="331" font-size="31" fill="#a4772d" font-weight="700" text-anchor="start">N² stock</text>
<text x="92" y="397" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Historical reachable nodes</text>
<text x="92" y="435" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Assumed agents and adoption</text>
<text x="92" y="473" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Inherited network density</text>
<rect x="445" y="208" width="335" height="335" rx="14" fill="#ffffff" stroke="#d9dccf"/>
<rect x="445" y="208" width="335" height="8" rx="4" fill="#60713f"/>
<text x="467" y="267" font-size="23" fill="#242820" font-weight="700" text-anchor="start">02  Protocol activity</text>
<text x="467" y="331" font-size="31" fill="#60713f" font-weight="700" text-anchor="start">11 value lanes</text>
<text x="467" y="397" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">One owner per paid carrier</text>
<text x="467" y="435" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">AMO split by five asset baskets</text>
<text x="467" y="473" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Shared views add no value</text>
<rect x="820" y="208" width="335" height="335" rx="14" fill="#ffffff" stroke="#d9dccf"/>
<rect x="820" y="208" width="335" height="8" rx="4" fill="#446c85"/>
<text x="842" y="267" font-size="23" fill="#242820" font-weight="700" text-anchor="start">03  Capacity</text>
<text x="842" y="331" font-size="31" fill="#446c85" font-weight="700" text-anchor="start">52.56B vB/year</text>
<text x="842" y="397" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">All physical writes share a cap</text>
<text x="842" y="435" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Boost originals add metadata</text>
<text x="842" y="473" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Service flows scale together</text>
<rect x="1195" y="208" width="335" height="335" rx="14" fill="#ffffff" stroke="#d9dccf"/>
<rect x="1195" y="208" width="335" height="8" rx="4" fill="#aa5a48"/>
<text x="1217" y="267" font-size="23" fill="#242820" font-weight="700" text-anchor="start">04  Diagnostics</text>
<text x="1217" y="331" font-size="27" fill="#aa5a48" font-weight="700" text-anchor="start">Derived WORK floor</text>
<text x="1217" y="397" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Scenario total divided by 21M</text>
<text x="1217" y="435" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">Movement counts are separate</text>
<text x="1217" y="473" font-size="19" fill="#666b61" font-weight="400" text-anchor="start">No circular value added</text>
<rect x="70" y="606" width="1460" height="236" rx="14" fill="#e8ebdd"/>
<text x="105" y="653" font-size="29" fill="#242820" font-weight="700" text-anchor="start">Every surface is covered; every economic carrier is counted once.</text>
<text x="105" y="712" font-size="21" fill="#666b61" font-weight="400" text-anchor="start">Write owners: IDs · Mail · Files/Drive · Browser authoring · AMO · Credits · Wallet · Infinity · Inception · Boost</text>
<text x="105" y="756" font-size="21" fill="#666b61" font-weight="400" text-anchor="start">Shared and read-only views: Computer · Desktop · Log · Growth · WORK dashboard · Home and compatibility routes</text>
<text x="105" y="800" font-size="21" fill="#666b61" font-weight="400" text-anchor="start">No duplicate file bytes, sale-ticket principal, WORK attachment value, synthetic bond issuance, or view-only traffic.</text>
<line x1="70" y1="911" x2="1530" y2="911" stroke="#d9dccf"/>
<text x="70" y="946" font-size="18" fill="#666b61" font-weight="400" text-anchor="start">Model breadth is not protocol activation. Current economic truth remains the shared confirmed-chain ledger.</text>
<text x="70" y="975" font-size="17" fill="#666b61" font-weight="400" text-anchor="start">2026-09-05-all-products-v1 · revised 2026-09-05 · baseline 2026-05-11</text>
</svg>
